name: Observability Probe

on:
  push:
    branches:
      - 'fix/runtime-qualification-probe'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6c5207813df3d5b83b9508125e0e9e12
    steps:
      - name: Query production Workers Observability
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error('Cloudflare observability probe credentials are unavailable.');
          const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/observability/telemetry`;
          const headers = { authorization: `Bearer ${token}`, 'content-type': 'application/json' };

          async function post(path, body) {
            const response = await fetch(`${base}/${path}`, {
              method: 'POST', headers, body: JSON.stringify(body),
            });
            const text = await response.text();
            let parsed;
            try { parsed = JSON.parse(text); } catch { parsed = { raw: text.slice(0, 1000) }; }
            if (!response.ok || parsed?.success === false) {
              throw new Error(`Workers Observability ${path} ${response.status}: ${JSON.stringify(parsed?.errors ?? parsed).slice(0, 1200)}`);
            }
            return parsed;
          }

          const requestStarted = Date.now();
          for (const path of ['/api/ready', '/api/projects', '/api/usage']) {
            const response = await fetch(`https://yupvox.qs3d.site${path}`, {
              headers: { accept: 'application/json', 'cache-control': 'no-cache' },
            });
            console.log(`fresh production request ${path} status=${response.status}`);
          }
          await new Promise((resolve) => setTimeout(resolve, 4000));
          const now = Date.now();
          const timeframe = { from: requestStarted - 5 * 60 * 1000, to: now + 15 * 1000 };

          const values = await post('values', {
            datasets: [],
            key: '$metadata.service',
            timeframe,
            type: 'string',
          });
          const valueRows = Array.isArray(values?.result) ? values.result : [];
          const safeServices = valueRows
            .map((row) => ({ dataset: String(row?.dataset ?? ''), service: String(row?.value ?? '') }))
            .filter((row) => row.service)
            .slice(0, 100);
          console.log(`service values=${JSON.stringify(safeServices)}`);

          const query = await post('query', {
            queryId: `dubflow-discovery-${now}`,
            timeframe,
            view: 'events',
            limit: 200,
            dry: true,
            parameters: { datasets: [] },
          });

          const envelope = query?.result?.events ?? {};
          const events = Array.isArray(envelope?.events) ? envelope.events : [];
          console.log(`unfiltered events returned=${events.length} total=${envelope?.count ?? events.length}`);

          function sanitized(event) {
            const metadata = event?.$metadata ?? event?.metadata ?? {};
            const workers = event?.$workers ?? {};
            return {
              service: metadata?.service,
              trigger: metadata?.trigger,
              type: metadata?.type,
              level: metadata?.level,
              error: metadata?.error,
              message: metadata?.message,
              url: metadata?.url,
              requestId: metadata?.requestId ?? workers?.requestId,
              outcome: workers?.outcome,
              scriptName: workers?.scriptName,
            };
          }

          const candidates = events.filter((event) => {
            const meta = sanitized(event);
            const text = JSON.stringify(meta);
            return meta.service === 'dubflow' || meta.scriptName === 'dubflow' ||
              /yupvox\.qs3d\.site|\/api\/(ready|projects|usage)|USAGE_SUMMARY_FAILED|Internal Server Error|exception|error/i.test(text);
          });
          console.log(`candidate production events=${candidates.length}`);
          for (const event of candidates.slice(0, 120)) console.log(JSON.stringify(sanitized(event)));

          if (valueRows.length === 0 && events.length === 0) {
            throw new Error('Workers Observability returned neither service values nor events for the fresh account window.');
          }
          NODE
