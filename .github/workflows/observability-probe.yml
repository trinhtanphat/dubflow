name: Observability Probe

on:
  push:
    branches:
      - 'fix/runtime-qualification-probe'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6c5207813df3d5b83b9508125e0e9e12
    steps:
      - name: Query production Workers Observability
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error('Cloudflare observability probe credentials are unavailable.');
          const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/observability/telemetry`;
          const headers = { authorization: `Bearer ${token}`, 'content-type': 'application/json' };

          async function post(path, body) {
            const response = await fetch(`${base}/${path}`, {
              method: 'POST',
              headers,
              body: JSON.stringify(body),
            });
            const text = await response.text();
            let parsed;
            try { parsed = JSON.parse(text); } catch { parsed = { raw: text.slice(0, 1000) }; }
            if (!response.ok || parsed?.success === false) {
              throw new Error(`Workers Observability ${path} ${response.status}: ${JSON.stringify(parsed?.errors ?? parsed).slice(0, 1200)}`);
            }
            return parsed;
          }

          // Generate fresh failing invocations inside the query window.
          const paths = ['/api/ready', '/api/projects', '/api/usage'];
          for (const path of paths) {
            const response = await fetch(`https://yupvox.qs3d.site${path}`, {
              headers: { accept: 'application/json', 'cache-control': 'no-cache' },
            });
            console.log(`fresh production request ${path} status=${response.status}`);
          }
          await new Promise((resolve) => setTimeout(resolve, 3000));

          const keys = await post('keys', {});
          const keyRows = Array.isArray(keys?.result) ? keys.result : [];
          const interestingKeys = keyRows
            .map((item) => item?.key)
            .filter((key) => typeof key === 'string' && (
              key.includes('$metadata') || /error|exception|message|status|url|request/i.test(key)
            ));
          console.log(`observability keys available=${keyRows.length}`);
          console.log(`interesting keys=${interestingKeys.slice(0, 80).join(',')}`);

          const now = Date.now();
          const query = await post('query', {
            queryId: `dubflow-runtime-${now}`,
            timeframe: { from: now - 5 * 60 * 1000, to: now + 10 * 1000 },
            view: 'events',
            limit: 200,
            dry: true,
            parameters: {
              datasets: [],
              filterCombination: 'and',
              filters: [
                { key: '$metadata.service', operation: 'eq', type: 'string', value: 'dubflow' }
              ]
            }
          });

          const result = query?.result ?? {};
          const events = Array.isArray(result?.events) ? result.events : [];
          console.log(`observability matching events=${events.length}`);

          function pick(obj, key) {
            if (!obj || typeof obj !== 'object') return undefined;
            if (Object.prototype.hasOwnProperty.call(obj, key)) return obj[key];
            return undefined;
          }
          function sanitizeEvent(event) {
            const metadata = event?.$metadata ?? event?.metadata ?? {};
            const attrs = event?.attributes ?? event?.data ?? {};
            const candidates = {
              id: metadata?.id,
              service: metadata?.service,
              trigger: metadata?.trigger,
              type: metadata?.type,
              level: metadata?.level,
              statusCode: metadata?.statusCode ?? metadata?.status_code,
              error: metadata?.error,
              message: metadata?.message,
              requestUrl: metadata?.request?.url ?? metadata?.url,
              outcome: metadata?.outcome,
              exception: pick(attrs, 'exception') ?? pick(attrs, 'exceptions') ?? pick(event, 'exceptions'),
              eventMessage: pick(event, 'message'),
            };
            const text = JSON.stringify(candidates);
            return text.length > 5000 ? text.slice(0, 5000) : text;
          }

          const relevant = events.filter((event) => {
            const text = JSON.stringify(event);
            return text.includes('/api/projects') || text.includes('/api/usage') || text.includes('/api/ready') || /error|exception|500|USAGE_SUMMARY_FAILED/i.test(text);
          });
          console.log(`relevant events=${relevant.length}`);
          for (const event of relevant.slice(0, 80)) console.log(sanitizeEvent(event));

          if (events.length === 0) {
            throw new Error('Workers Observability query succeeded but returned no dubflow events in the fresh request window.');
          }
          NODE
