name: Cloudflare Workers Builds state probe

on:
  push:
    branches:
      - probe/cloudflare-build-state

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CURRENT_ACCOUNT_ID: 6c5207813df3d5b83b9508125e0e9e12
      LEGACY_ACCOUNT_ID: 50afb4fd3c4c7a1f3e1bdb7f22d4af7f
      TARGET_SHA: 4b36730c27fd940c7eb97975f72380fb3a785525
    steps:
      - name: Inspect current and legacy Cloudflare routing state
        shell: bash
        run: |
          set -u
          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          cfget() { curl --silent --show-error --location "$1" -H "$auth"; }

          echo '=== CURRENT ACCOUNT: dubflow worker ==='
          scripts="$(cfget "$api/accounts/$CURRENT_ACCOUNT_ID/workers/scripts")"
          printf '%s' "$scripts" | jq -c '{success,errors,result:[.result[]? | select(.id == "dubflow") | {id,tag,modified_on,created_on}]}'
          tag="$(printf '%s' "$scripts" | jq -r '.result[]? | select(.id == "dubflow") | .tag' | head -n1)"

          echo '=== CURRENT ACCOUNT: production trigger ==='
          cfget "$api/accounts/$CURRENT_ACCOUNT_ID/builds/workers/$tag/triggers" | jq -c '{success,errors,result:[.result[]? | {trigger_uuid,build_command,deploy_command,branch_includes,build_token_name,build_token_uuid}]}'

          echo '=== CURRENT ACCOUNT: target build ==='
          builds="$(cfget "$api/accounts/$CURRENT_ACCOUNT_ID/builds/workers/$tag/builds")"
          printf '%s' "$builds" | jq -c --arg sha "$TARGET_SHA" '{success,errors,result:[.result[]? | select(.build_trigger_metadata.commit_hash == $sha) | {build_uuid,status,build_outcome,created_on,stopped_on,build_trigger_metadata}]}'

          echo '=== CURRENT ACCOUNT: latest active deployment ==='
          cfget "$api/accounts/$CURRENT_ACCOUNT_ID/workers/scripts/dubflow/deployments" | jq -c '{success,errors,latest:(.result.deployments[0] // null)}'

          echo '=== CURRENT ACCOUNT: yupvox custom domain ==='
          cfget "$api/accounts/$CURRENT_ACCOUNT_ID/workers/domains?hostname=yupvox.qs3d.site" | jq -c '{success,errors,result}'

          echo '=== LEGACY ACCOUNT: dubflow worker ==='
          legacy_scripts="$(cfget "$api/accounts/$LEGACY_ACCOUNT_ID/workers/scripts")"
          printf '%s' "$legacy_scripts" | jq -c '{success,errors,result:[.result[]? | select(.id == "dubflow") | {id,tag,modified_on,created_on}]}'

          echo '=== LEGACY ACCOUNT: yupvox custom domain ==='
          cfget "$api/accounts/$LEGACY_ACCOUNT_ID/workers/domains?hostname=yupvox.qs3d.site" | jq -c '{success,errors,result}'

          echo '=== LEGACY ACCOUNT: latest dubflow deployment ==='
          cfget "$api/accounts/$LEGACY_ACCOUNT_ID/workers/scripts/dubflow/deployments" | jq -c '{success,errors,latest:(.result.deployments[0] // null)}'

          echo '=== LIVE API snapshot ==='
          for path in /api/ready /api/projects /api/usage; do
            body="$(mktemp)"
            code="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' --max-time 20 "https://yupvox.qs3d.site$path" || printf '000')"
            echo "$path status=$code body=$(cat "$body")"
            rm -f "$body"
          done
