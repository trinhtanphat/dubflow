name: Cloudflare Workers Builds state probe

on:
  push:
    branches:
      - probe/cloudflare-build-state

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CURRENT_ACCOUNT_ID: 6c5207813df3d5b83b9508125e0e9e12
      LEGACY_ACCOUNT_ID: 50afb4fd3c4c7a1f3e1bdb7f22d4af7f
      CURRENT_TAG: ed49a7dcf94c407aafa2bedf4311331f
      LEGACY_TAG: cec78627dd174827ab210bc09108fb1c
    steps:
      - name: Inspect Workers Builds triggers on both accounts
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          cfget() { curl --silent --show-error --location "$1" -H "$auth"; }

          echo '=== CURRENT ACCOUNT BUILDS TRIGGERS ==='
          cfget "$api/accounts/$CURRENT_ACCOUNT_ID/builds/workers/$CURRENT_TAG/triggers" \
            | jq -c '{success,errors,result:[.result[]? | {trigger_uuid,trigger_name,repo_name,provider_account_name,provider_type,build_command,deploy_command,root_directory,branch_includes,branch_excludes,build_token_name,build_token_uuid}]}'

          echo '=== LEGACY ACCOUNT BUILDS TRIGGERS ==='
          cfget "$api/accounts/$LEGACY_ACCOUNT_ID/builds/workers/$LEGACY_TAG/triggers" \
            | jq -c '{success,errors,result:[.result[]? | {trigger_uuid,trigger_name,repo_name,provider_account_name,provider_type,build_command,deploy_command,root_directory,branch_includes,branch_excludes,build_token_name,build_token_uuid}]}'

          echo '=== LEGACY RECENT BUILDS ==='
          cfget "$api/accounts/$LEGACY_ACCOUNT_ID/builds/workers/$LEGACY_TAG/builds" \
            | jq -c '{success,errors,result:[.result[:10][]? | {build_uuid,status,build_outcome,created_on,stopped_on,build_trigger_metadata}]}'
