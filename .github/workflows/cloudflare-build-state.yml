name: Cloudflare Workers Builds state probe

on:
  push:
    branches:
      - probe/cloudflare-build-state

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CURRENT_ACCOUNT_ID: 6c5207813df3d5b83b9508125e0e9e12
      LEGACY_ACCOUNT_ID: 50afb4fd3c4c7a1f3e1bdb7f22d4af7f
      CURRENT_TAG: ed49a7dcf94c407aafa2bedf4311331f
      LEGACY_TAG: cec78627dd174827ab210bc09108fb1c
      GITHUB_ACCOUNT_ID: '89531707'
      GITHUB_REPO_ID: '1357840238'
    steps:
      - name: Inspect legacy Builds prerequisites
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          cfget() { curl --silent --show-error --location "$1" -H "$auth"; }

          echo '=== CURRENT BUILDS TOKENS ==='
          cfget "$api/accounts/$CURRENT_ACCOUNT_ID/builds/tokens" \
            | jq -c '{success,errors,result:[.result[]? | {build_token_uuid,build_token_name,created_on,modified_on}]}'

          echo '=== LEGACY BUILDS TOKENS ==='
          cfget "$api/accounts/$LEGACY_ACCOUNT_ID/builds/tokens" \
            | jq -c '{success,errors,result:[.result[]? | {build_token_uuid,build_token_name,created_on,modified_on}]}'

          echo '=== LEGACY GITHUB REPO CONFIG AUTOFILL ==='
          cfget "$api/accounts/$LEGACY_ACCOUNT_ID/builds/repos/github/$GITHUB_ACCOUNT_ID/$GITHUB_REPO_ID/config_autofill" \
            | jq -c '{success,errors,messages,result}'

          echo '=== CURRENT TRIGGER FULL CONNECTION METADATA ==='
          cfget "$api/accounts/$CURRENT_ACCOUNT_ID/builds/workers/$CURRENT_TAG/triggers" \
            | jq -c '{success,errors,result:[.result[]? | {trigger_uuid,build_token_uuid,build_token_name,repo_connection,external_script_id,build_command,deploy_command}]}'
