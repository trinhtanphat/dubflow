name: Production Binding Probe

on:
  push:
    branches:
      - 'fix/runtime-qualification-probe'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6c5207813df3d5b83b9508125e0e9e12
    steps:
      - name: Compare deployed Worker D1 binding with exact bound schema
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error('Cloudflare probe credentials are unavailable.');
          const headers = { authorization: `Bearer ${token}`, 'content-type': 'application/json' };

          async function cf(url, init = {}) {
            const response = await fetch(url, { ...init, headers: { ...headers, ...(init.headers ?? {}) } });
            const body = await response.json();
            if (!response.ok || body?.success === false) {
              throw new Error(`Cloudflare API ${response.status}: ${JSON.stringify(body?.errors ?? body).slice(0, 800)}`);
            }
            return body;
          }

          const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}`;
          const settings = await cf(`${base}/workers/scripts/dubflow/settings`);
          const bindings = Array.isArray(settings?.result?.bindings) ? settings.result.bindings : [];
          const dbBinding = bindings.find((binding) => binding?.type === 'd1' && binding?.name === 'DB');
          if (!dbBinding?.database_id) throw new Error('Deployed Worker DB binding was not found.');
          const databaseId = dbBinding.database_id;
          console.log(`production Worker DB binding database_id=${databaseId}`);

          const dbInfo = await cf(`${base}/d1/database/${databaseId}`);
          console.log(`production Worker DB resource name=${dbInfo?.result?.name ?? 'unknown'}`);

          async function query(sql) {
            const response = await cf(`${base}/d1/database/${databaseId}/query`, {
              method: 'POST',
              body: JSON.stringify({ sql }),
            });
            const page = Array.isArray(response?.result) ? response.result[0] : response?.result;
            return page?.results ?? [];
          }

          const projectColumns = (await query('PRAGMA table_info(projects);')).map((row) => row.name);
          const usageColumns = (await query('PRAGMA table_info(usage_events);')).map((row) => row.name);
          const migrations = (await query('SELECT name FROM d1_migrations ORDER BY id;')).map((row) => row.name);
          console.log(`projects columns=${projectColumns.join(',')}`);
          console.log(`usage_events columns=${usageColumns.join(',')}`);
          console.log(`migration ledger=${migrations.join(',')}`);

          const requiredProjectColumns = ['export_object_key', 'translation_style', 'translation_context_revision', 'target_languages_revision'];
          const requiredUsageColumns = ['job_id', 'phase', 'operation_key'];
          const missingProject = requiredProjectColumns.filter((name) => !projectColumns.includes(name));
          const missingUsage = requiredUsageColumns.filter((name) => !usageColumns.includes(name));
          console.log(`missing projects columns=${missingProject.join(',') || 'none'}`);
          console.log(`missing usage columns=${missingUsage.join(',') || 'none'}`);
          if (missingProject.length || missingUsage.length) process.exit(1);
          NODE
