name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify source and production build
        run: npm run verify

      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run

      - name: Probe deployed production runtime
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const checks = [
            {
              name: 'ready',
              url: 'https://yupvox.qs3d.site/api/ready',
              validate(status, body) {
                return status === 200 && body?.ready === true && body?.service === 'dubflow' && body?.database === 'ready';
              },
              describe(body) {
                return JSON.stringify(body);
              },
            },
            {
              name: 'projects',
              url: 'https://yupvox.qs3d.site/api/projects',
              validate(status, body) {
                return status === 200 && Array.isArray(body);
              },
              describe(body) {
                return Array.isArray(body) ? `array(length=${body.length})` : `error=${body?.error?.code ?? 'unexpected-body'}`;
              },
            },
            {
              name: 'usage',
              url: 'https://yupvox.qs3d.site/api/usage',
              validate(status, body) {
                return status === 200 && body !== null && typeof body === 'object' && !Array.isArray(body);
              },
              describe(body) {
                return body && typeof body === 'object' ? `object(keys=${Object.keys(body).sort().join(',')})` : 'unexpected-body';
              },
            },
          ];

          let lastFailure = 'no attempts executed';
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            let allOk = true;
            const failures = [];
            for (const check of checks) {
              try {
                const response = await fetch(check.url, {
                  headers: { accept: 'application/json', 'cache-control': 'no-cache' },
                  redirect: 'follow',
                });
                const text = await response.text();
                let body;
                try {
                  body = JSON.parse(text);
                } catch {
                  body = null;
                }
                const ok = check.validate(response.status, body);
                console.log(`[attempt ${attempt}] ${check.name}: status=${response.status} ok=${ok} ${check.describe(body)}`);
                if (!ok) {
                  allOk = false;
                  failures.push(`${check.name}:status=${response.status}:${check.describe(body)}`);
                }
              } catch (error) {
                allOk = false;
                failures.push(`${check.name}:network=${error instanceof Error ? error.message : String(error)}`);
              }
            }
            if (allOk) {
              console.log('Production runtime smoke PASS: readiness, projects, and usage are healthy.');
              process.exit(0);
            }
            lastFailure = failures.join(' | ');
            if (attempt < 12) await sleep(5000);
          }
          console.error(`Production runtime smoke FAILED: ${lastFailure}`);
          process.exit(1);
          NODE

      - name: Install CJK screenshot font
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Capture reference screenshots
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/yupvox-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/yupvox-vite.log
              exit 1
            fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chromium-compatible browser found on runner.' >&2
            exit 1
          fi
          "$CHROME" \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --hide-scrollbars \
            --window-size=1448,1086 \
            --screenshot="$RUNNER_TEMP/yupvox-v2-2-reference.png" \
            http://127.0.0.1:5173/
          "$CHROME" \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --hide-scrollbars \
            --window-size=1364,767 \
            --screenshot="$RUNNER_TEMP/yupvox-1364x767-reference.png" \
            http://127.0.0.1:5173/
          test -s "$RUNNER_TEMP/yupvox-v2-2-reference.png"
          test -s "$RUNNER_TEMP/yupvox-1364x767-reference.png"

      - name: Upload reference screenshot
        uses: actions/upload-artifact@v4
        with:
          name: yupvox-reference-${{ github.sha }}
          path: |
            ${{ runner.temp }}/yupvox-v2-2-reference.png
            ${{ runner.temp }}/yupvox-1364x767-reference.png
          if-no-files-found: error
          retention-days: 14
