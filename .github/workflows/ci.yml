name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify source and production build
        run: npm run verify

      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run

      - name: Capture reference screenshots
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/yupvox-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/yupvox-vite.log
              exit 1
            fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chromium-compatible browser found on runner.' >&2
            exit 1
          fi
          "$CHROME" \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --hide-scrollbars \
            --window-size=1448,1086 \
            --screenshot="$RUNNER_TEMP/yupvox-v2-2-reference.png" \
            http://127.0.0.1:5173/
          "$CHROME" \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --hide-scrollbars \
            --window-size=1364,767 \
            --screenshot="$RUNNER_TEMP/yupvox-1364x767-reference.png" \
            http://127.0.0.1:5173/
          test -s "$RUNNER_TEMP/yupvox-v2-2-reference.png"
          test -s "$RUNNER_TEMP/yupvox-1364x767-reference.png"

      - name: Upload reference screenshot
        uses: actions/upload-artifact@v4
        with:
          name: yupvox-reference-${{ github.sha }}
          path: |
            ${{ runner.temp }}/yupvox-v2-2-reference.png
            ${{ runner.temp }}/yupvox-1364x767-reference.png
          if-no-files-found: error
          retention-days: 14
