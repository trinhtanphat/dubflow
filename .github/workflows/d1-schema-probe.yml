name: D1 Schema Probe

on:
  push:
    branches:
      - 'fix/runtime-qualification-probe'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6c5207813df3d5b83b9508125e0e9e12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Inspect remote D1 migration/schema metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'CLOUDFLARE_API_TOKEN is unavailable to GitHub Actions; schema probe cannot authenticate.' >&2
            exit 2
          fi
          echo '--- unapplied migrations ---'
          npx wrangler d1 migrations list DB --remote
          echo '--- projects columns ---'
          npx wrangler d1 execute DB --remote --command "PRAGMA table_info(projects);" --json
          echo '--- usage_events columns ---'
          npx wrangler d1 execute DB --remote --command "PRAGMA table_info(usage_events);" --json
          echo '--- migration ledger ---'
          npx wrangler d1 execute DB --remote --command "SELECT name FROM d1_migrations ORDER BY id;" --json
