name: Live production probe after #61

on:
  push:
    branches:
      - probe/live-after-61

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production schema and API recovery
        shell: bash
        run: |
          set -u
          base='https://yupvox.qs3d.site'
          project1='ba343bcf-4e42-4267-a67f-aee491be3dac'
          project2='c0f85801-ee27-476f-84ff-500509d52700'

          probe() {
            curl --silent --show-error --location \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 20 \
              "$1" || printf '000'
          }

          for attempt in $(seq 1 30); do
            ready="$(probe "$base/api/ready")"
            projects="$(probe "$base/api/projects")"
            usage="$(probe "$base/api/usage")"
            p1="$(probe "$base/api/projects/$project1")"
            p2="$(probe "$base/api/projects/$project2")"

            printf 'attempt=%s ready=%s projects=%s usage=%s project1=%s project2=%s\n' \
              "$attempt" "$ready" "$projects" "$usage" "$p1" "$p2"

            if [[ "$ready" == '200' && "$projects" == '200' && "$usage" == '200' && "$p1" != '500' && "$p1" != '000' && "$p2" != '500' && "$p2" != '000' ]]; then
              echo 'Production API recovery verified.'
              exit 0
            fi

            sleep 10
          done

          echo 'Production API did not recover within the probe window.' >&2
          exit 1
