name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - ops/deploy-phase4c-1b2f3b0a
    paths:
      - .github/workflows/deploy-cloudflare.yml

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 50afb4fd3c4c7a1f3e1bdb7f22d4af7f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GOOGLE_CLOUD_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_CLOUD_TRANSLATE_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_DEFAULT_VOICE_ID: ${{ secrets.ELEVENLABS_DEFAULT_VOICE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Require Cloudflare token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Verify and deploy YupVox
        run: npm run deploy

      - name: Sync optional Google Translation secret
        if: ${{ env.GOOGLE_CLOUD_TRANSLATE_API_KEY != '' }}
        shell: bash
        run: printf '%s' "$GOOGLE_CLOUD_TRANSLATE_API_KEY" | npx wrangler secret put GOOGLE_CLOUD_TRANSLATE_API_KEY

      - name: Sync optional Deepgram diarization secret
        if: ${{ env.DEEPGRAM_API_KEY != '' }}
        shell: bash
        run: printf '%s' "$DEEPGRAM_API_KEY" | npx wrangler secret put DEEPGRAM_API_KEY

      - name: Sync optional ElevenLabs API key
        if: ${{ env.ELEVENLABS_API_KEY != '' }}
        shell: bash
        run: printf '%s' "$ELEVENLABS_API_KEY" | npx wrangler secret put ELEVENLABS_API_KEY

      - name: Sync optional ElevenLabs default voice
        if: ${{ env.ELEVENLABS_DEFAULT_VOICE_ID != '' }}
        shell: bash
        run: printf '%s' "$ELEVENLABS_DEFAULT_VOICE_ID" | npx wrangler secret put ELEVENLABS_DEFAULT_VOICE_ID

      - name: Verify production readiness after secret sync
        run: node scripts/verify-deployment.mjs
