name: Remote Dev Runtime Probe

on:
  push:
    branches:
      - 'fix/runtime-qualification-probe'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6c5207813df3d5b83b9508125e0e9e12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build assets
        run: npm run build

      - name: Reproduce API reads with full production bindings except custom route
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.name = 'dubflow-runtime-probe-full';
          delete config.routes;
          config.d1_databases = [{
            binding: 'DB',
            database_name: 'dubflow-db',
            database_id: '4ce2cfa0-1876-48dc-8cc8-ec4f9b1523c3',
            migrations_dir: 'migrations',
          }];
          fs.writeFileSync('.wrangler.runtime-probe.json', JSON.stringify(config, null, 2));
          NODE

          log="$RUNNER_TEMP/wrangler-remote-dev.log"
          : > "$log"
          npx wrangler dev --remote --config .wrangler.runtime-probe.json --port 8787 --log-level debug >"$log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -f .wrangler.runtime-probe.json
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 75); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8787/api/health; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Wrangler remote dev exited before becoming ready.' >&2
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo '--- remote dev startup log ---'
            sed -n '1,500p' "$log" | sed -E 's/(Bearer|token|authorization)[^ ,}]*/\1 [redacted]/Ig'
            exit 2
          fi

          failed=0
          for path in ready projects usage; do
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/$path.body" --write-out '%{http_code}' \
              -H 'accept: application/json' -H 'cache-control: no-cache' \
              "http://127.0.0.1:8787/api/$path")"
            body="$(cat "$RUNNER_TEMP/$path.body")"
            printf 'remote-dev-full /api/%s status=%s body-prefix=%s\n' "$path" "$status" "${body:0:500}"
            if [ "$status" -ge 500 ]; then failed=1; fi
          done

          sleep 2
          echo '--- remote dev full runtime log (sanitized) ---'
          sed -n '1,700p' "$log" | sed -E 's/(Bearer|token|authorization)[^ ,}]*/\1 [redacted]/Ig'
          exit "$failed"
