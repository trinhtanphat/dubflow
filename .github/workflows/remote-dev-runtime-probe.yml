name: Remote Dev Runtime Probe

on:
  push:
    branches:
      - 'fix/runtime-qualification-probe'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6c5207813df3d5b83b9508125e0e9e12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Reproduce API reads in remote development runtime
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wrangler-remote-dev.log"
          : > "$log"
          npx wrangler dev --remote --port 8787 --log-level debug >"$log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 45); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8787/api/health; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Wrangler remote dev exited before becoming ready.' >&2
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo '--- remote dev startup log ---'
            sed -n '1,240p' "$log" | sed -E 's/(Bearer|token|authorization)[^ ,}]*/\1 [redacted]/Ig'
            exit 2
          fi

          for path in ready projects usage; do
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/$path.body" --write-out '%{http_code}' \
              -H 'accept: application/json' -H 'cache-control: no-cache' \
              "http://127.0.0.1:8787/api/$path")"
            body="$(cat "$RUNNER_TEMP/$path.body")"
            printf 'remote-dev /api/%s status=%s body-prefix=%s\n' "$path" "$status" "${body:0:500}"
          done

          sleep 2
          echo '--- remote dev runtime log (sanitized) ---'
          sed -n '1,320p' "$log" | sed -E 's/(Bearer|token|authorization)[^ ,}]*/\1 [redacted]/Ig'
