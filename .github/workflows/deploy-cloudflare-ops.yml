name: Cloudflare Analytics Probe

on:
  push:
    branches:
      - ops/deploy-phase4c-1b2f3b0a
    paths:
      - .github/workflows/deploy-cloudflare-ops.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 50afb4fd3c4c7a1f3e1bdb7f22d4af7f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Require Cloudflare token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Probe Analytics Engine SQL API
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/analytics_engine/sql" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: text/plain' \
            --data 'SHOW TABLES')"
          echo "Analytics Engine SQL HTTP status: ${http_code}"
          cat "$response_file"
          echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
