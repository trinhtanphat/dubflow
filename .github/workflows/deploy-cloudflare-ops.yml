name: Cloudflare Container Entitlement Probe

on:
  push:
    branches:
      - ops/deploy-phase4c-1b2f3b0a
    paths:
      - .github/workflows/deploy-cloudflare-ops.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 50afb4fd3c4c7a1f3e1bdb7f22d4af7f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Require Cloudflare token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Read Workers account settings
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/workers-settings.json --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/account-settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          echo "Workers account settings HTTP status: ${code}"
          cat /tmp/workers-settings.json
          echo
          test "$code" = "200"

      - name: Probe Containers identity endpoint
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/containers-me.json --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/containers/me" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          echo "Containers identity HTTP status: ${code}"
          cat /tmp/containers-me.json
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            exit 1
          fi
