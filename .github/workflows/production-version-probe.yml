name: Production Version Probe

on:
  push:
    branches:
      - 'fix/runtime-qualification-probe'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6c5207813df3d5b83b9508125e0e9e12
      EXPECTED_MAIN_VERSION_ID: a3250a7c-7ddb-49eb-9a35-abc6536f0bd4
    steps:
      - name: Inspect active production deployment version
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const expected = process.env.EXPECTED_MAIN_VERSION_ID;
          if (!token || !accountId || !expected) throw new Error('Probe configuration is incomplete.');
          const headers = { authorization: `Bearer ${token}`, accept: 'application/json' };
          async function cf(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}${path}`, { headers });
            const body = await response.json();
            if (!response.ok || body?.success === false) throw new Error(`Cloudflare API ${response.status}: ${JSON.stringify(body?.errors ?? body).slice(0, 800)}`);
            return body.result;
          }
          const deploymentResult = await cf('/workers/scripts/dubflow/deployments');
          const deployments = Array.isArray(deploymentResult?.deployments)
            ? deploymentResult.deployments
            : Array.isArray(deploymentResult)
              ? deploymentResult
              : [];
          if (deployments.length === 0) throw new Error('No production deployments returned.');
          deployments.sort((a, b) => Date.parse(b.created_on ?? 0) - Date.parse(a.created_on ?? 0));
          const latest = deployments[0];
          const active = Array.isArray(latest?.versions)
            ? latest.versions.slice().sort((a, b) => Number(b.percentage ?? 0) - Number(a.percentage ?? 0))[0]
            : null;
          const activeVersionId = active?.version_id ?? '';
          console.log(`latest deployment id=${latest?.id ?? 'unknown'} created_on=${latest?.created_on ?? 'unknown'} source=${latest?.source ?? 'unknown'}`);
          console.log(`active version id=${activeVersionId} percentage=${active?.percentage ?? 'unknown'}`);
          const version = activeVersionId ? await cf(`/workers/scripts/dubflow/versions/${activeVersionId}`) : null;
          console.log(`active version number=${version?.number ?? 'unknown'} source=${version?.metadata?.source ?? 'unknown'} created_on=${version?.metadata?.created_on ?? 'unknown'}`);
          console.log(`expected main Workers Build version id=${expected}`);
          if (activeVersionId !== expected) {
            console.error(`ACTIVE_VERSION_MISMATCH active=${activeVersionId} expected=${expected}`);
            process.exit(1);
          }
          console.log('Active production version matches the successful Workers Build for main.');
          NODE
